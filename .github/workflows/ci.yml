name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Mypy (strict)
        run: python -m mypy

      - name: Tests with coverage gate (>=85%)
        run: python -m pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  governance:
    name: FEG pipeline gates (fairness policy enforced in CI)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      # Governance-as-code: the same fairness gates that protect production
      # run here. A discriminatory model fails this job.
      - name: Train under fairness gates
        run: feg train --smoke

      - name: Run drift monitoring scenarios
        run: feg monitor

      - name: Verify audit-trail hash chain
        run: feg audit-verify

      - name: Record human approval (demo sign-off)
        run: feg approve --version 1 --actor "ci-risk-officer" --reason "CI evidence review"

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: feg-pipeline-evidence
          path: |
            artifacts/registry
            artifacts/monitoring
            artifacts/runs
          if-no-files-found: error

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable .

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify metadata
        run: python -m pip install twine && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: feg-mlops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
