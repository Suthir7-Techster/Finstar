[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "feg-mlops"
version = "0.1.0"
description = "Enterprise reference implementation of the Fairness-Explainability-Governance (FEG) framework for responsible KYC/FinTech decisioning, after Oduro-Gyan et al. (2025)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "feg-mlops contributors" }]
keywords = [
  "responsible-ai",
  "mlops",
  "fairness",
  "explainability",
  "governance",
  "kyc",
  "fintech",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "shap>=0.45",
  "joblib>=1.3",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pandas-stubs>=2.2",
  "build>=1.2",
  "pip-audit>=2.7",
]

[project.scripts]
feg = "feg_mlops.pipeline.cli:main"

[project.urls]
Documentation = "https://github.com/example/feg-mlops/tree/main/docs"
Source = "https://github.com/example/feg-mlops"

[tool.hatch.build.targets.wheel]
packages = ["src/feg_mlops"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "B008", # FastAPI dependency defaults construct at import time by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["feg_mlops"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["shap.*", "joblib.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: end-to-end pipeline and API tests",
]
filterwarnings = [
  "ignore::DeprecationWarning:shap.*",
  "ignore::PendingDeprecationWarning:shap.*",
]

[tool.coverage.run]
source = ["src/feg_mlops"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
